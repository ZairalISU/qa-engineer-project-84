  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - открыть DevTools
    - открыть вкладку Network
    - выбрать любой товар
    - нажать кнопку "В корзину"
    - перейти в корзину
    - нажать кнопку "Оформить заказ"
  expected-result: |
    Сервер возвращает статус-код 200 OK
  actual-result: |
    Сервер возвращает статус-код 500 Internal Server Error

