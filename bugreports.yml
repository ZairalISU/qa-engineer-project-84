---
- summary: |
    Локаль в карточке товара не сменяется на русскую
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - открыть языковое меню 
    - выбрать русскую локаль 
    - выбрать любой товар 
    - открыть выбранный товар
  expected-result: |
    Локаль меняется на русскую
  actual-result: |
    Локаль английская

- summary: |
    После оформления заказа корзина не очищается
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - выбрать 2 любых товара
    - добавить выбранные товары в корзину
    - открыть корзину
    - нажать кнопку "Оформить"
    - закрыть страницу оформления товара
  expected-result: |
    В корзине нет товаров
  actual-result: |
    Товары находятся в корзине

