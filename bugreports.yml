- summary: |
    Со страницы товара можно добавить в корзину товар, которого нет в наличии
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - убрать In Stock
    - полистать страницы каталога и найти товар, которого нет в наличии
    - нажать на карточку этого товара
    - попробовать добавить его в корзину
    - открыть корзину
  expected-result: |
    Товар не добавился в корзину
  actual-result: |
    Товар добавился в корзину

- summary: |
    в выпадающем списке рядом с английским языком нет картинки с флагом, как рядом с русским 
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - открыть список Language
  expected-result: |
    Рядом с языками отображаются соотвествующие картинки
  actual-result: |
    Рядом с английским картинка не прогружается

- summary: |
    Со страницы товара нет возможности вернуться на соответствующую страницу каталога
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - перейти на вторую страницу каталога
    - открыть карточку первого товара второй страницы
    - нажать на Store
  expected-result: |
    Отображается вторая страница каталога
  actual-result: |
    Страница перезагружается и поэтому каталог отображается с первой страницы

- summary: |
    Цена товаров в корзине рассчитывается неправильно
  environment: |
    Google Chrome 131.0.6778.108 (Официальная сборка), (64 бит)
    Windows 10 Домашняя
  steps-to-reproduce: |
    - добавить товар в корзину
    - еще раз добавить этот же
    - добавить другой товар
    - перейти в корзину
    - посчитать вручную цену заказа
  expected-result: |
    В корзине отображается правильная цена заказа
  actual-result: |
    В корзине отображается неправильная цена заказа, добавляется 1 цент
